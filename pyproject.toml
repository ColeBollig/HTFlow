[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htflow"
version = "0.1.0"
description = "Experimental data flow runner built specifically to integrate with HTCondor"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
htcondor = ["htcondor"]

[project.scripts]
htflow = "htflow.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["htflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -ra: show skip/xfail reasons even without -v.
# --strict-markers: a typo'd marker name fails collection instead of warning.
# --timeout-method=thread: pytest-timeout's cross-platform method (no
# signal.alarm() dependency, which doesn't exist on Windows) -- explicit
# rather than relying on its own Windows auto-detection.
addopts = "-ra --strict-markers --timeout-method=thread"
markers = [
    # Kind: what the test is for. Not strictly exclusive (e.g. regression + integration).
    "unit: isolated test of a single component's logic, no live external system. Default.",
    "regression: guards against a previously-fixed bug recurring; apply by hand.",
    "integration: exercises multiple components across a real boundary. Auto-applied via the condor_schedd fixture.",
    # Liveness: requires a live, reachable HTCondor Schedd.
    "live: requires a live, reachable HTCondor Schedd. Auto-applied via the condor_schedd fixture.",
    # Backend: subset of `live` naming which backend is exercised.
    "condor: the live backend is HTCondor. Auto-applied alongside `live`; currently identical to it.",
    # Speed: based on nominal runtime, not what's tested.
    "fast: well under 10 seconds. Default.",
    "slow: 10+ seconds, e.g. a real backend daemon round trip. Auto-applied via the condor_schedd fixture.",
]
