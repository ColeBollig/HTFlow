[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htflow"
version = "0.1.0"
description = "Experimental data flow runner built specifically to integrate with HTCondor"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
htcondor = ["htcondor"]

[project.scripts]
htflow = "htflow.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["htflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -ra: always show a short summary of skip/xfail reasons at the end of the
# run, even without -v -- so a skipped HTCondor-Schedd test is never buried.
addopts = "-ra"
