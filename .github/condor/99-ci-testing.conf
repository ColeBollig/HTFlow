# Shared HTCondor local config for live-condor-tests.yml's throwaway,
# single-machine personal pools (Linux and Windows). Copied verbatim into
# each platform's own LOCAL_CONFIG_DIR -- a config.d-style drop-in
# directory HTCondor supports on both platforms (`condor_config_val
# LOCAL_CONFIG_DIR`; on Windows this needs `mkdir`ing first, per the
# installer's own default condor_config comment) -- rather than
# maintained twice as near-duplicate inline heredocs/Add-Content calls.

# Stock timing defaults (SCHEDD_INTERVAL defaults to 300s in particular)
# are tuned for a real pool, not a single-node test instance -- a freshly
# submitted job can otherwise sit idle for minutes waiting on a daemon's
# own periodic cycle. These values are HTCondor's own Ornithology test
# framework's DEFAULT_PARAMS (src/condor_tests/ornithology/condor.py) --
# not correctness-affecting, just how often daemons poll/report/negotiate.
# Safe for a personal/test pool; never do this to a production pool.
UPDATE_INTERVAL = 2
POLLING_INTERVAL = 2
NEGOTIATOR_INTERVAL = 2
NEGOTIATOR_MIN_INTERVAL = 2
NEGOTIATOR_CYCLE_DELAY = 2
SCHEDD_INTERVAL = 30
STARTER_UPDATE_INTERVAL = 2
STARTER_INITIAL_UPDATE_INTERVAL = 2
SHADOW_QUEUE_UPDATE_INTERVAL = 2
MachineMaxVacateTime = 2
RUNBENCHMARKS = 0

# HTCondor 9.0+'s secure-by-default policy -- `use SECURITY:recommended
# (SYSTEM, Administrator@*)`, baked into the installer's own default
# condor_config on both platforms -- authorizes administrative commands
# only for SYSTEM and a literal "Administrator" identity. On Windows,
# GitHub's runner authenticates as "runneradmin" (a member of the
# Administrators *group*, not that literal account), so every
# authenticated administrative command is cleanly DENIED
# ("SECMAN:2010: Received DENIED... using method NTSSPI") until this is
# widened. This never bit the Linux job, only because minicondor's
# daemons and its own client commands happen to both run as root, so
# FS-based auth already satisfies the recommended policy's trust by
# accident -- not because the policy itself is any less restrictive
# there. A throwaway, single-machine, single-purpose CI pool gains
# nothing from keeping that restriction on either platform, so widen
# every authorization level explicitly instead of relying on identity
# matching that happens to differ across platforms.
ALLOW_READ = *
ALLOW_WRITE = *
ALLOW_ADMINISTRATOR = *
ALLOW_CONFIG = *
ALLOW_DAEMON = *
ALLOW_NEGOTIATOR = *
ALLOW_CLIENT = *
ALLOW_ADVERTISE_MASTER = *
ALLOW_ADVERTISE_SCHEDD = *
ALLOW_ADVERTISE_STARTD = *
