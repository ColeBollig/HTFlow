# Windows-only addition to 99-ci-testing.conf (see that file for the
# settings shared with Linux). Appended directly onto condor_config.local
# (not LOCAL_CONFIG_DIR, which is read earlier) by the CI workflow.
#
# Local-universe jobs on Windows always run under the submitting user's
# own identity -- unlike vanilla-universe jobs, there's no low-privilege
# "nobody" fallback for it. That needs a stored Windows credential
# (STARTER_ALLOW_RUNAS_OWNER here, `condor_store_cred` in the workflow).
#
# This does NOT use condor_credd: with no CREDD_HOST configured,
# condor_store_cred stores the credential straight to the local schedd,
# which has its own STORE_CRED handler for exactly this single-machine
# case (see condor_schedd.cpp, #ifdef WIN32). A separate condor_credd
# daemon is only needed for multi-machine pools.
STARTER_ALLOW_RUNAS_OWNER = True
