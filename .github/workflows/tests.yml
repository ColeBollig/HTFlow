name: Tests

on:
  # Scoped to main only: pull_request's default types (opened, synchronize,
  # reopened) already cover a PR branch -- once when the PR opens, once per
  # subsequent push. An unscoped `push:` here would ALSO fire on every push
  # to an open PR's branch (a different event, same commit), running this
  # workflow twice per push. Direct pushes to main (e.g. a squash-merge)
  # still need their own trigger, since no pull_request event covers them.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Edit this list to add or remove target operating systems ──────────
          # GitHub-hosted runner (no container field):
          #   runner: macos-latest | ubuntu-latest | windows-latest
          # Container on ubuntu-latest (set both runner and container):
          #   runner: ubuntu-latest
          #   container: <image>:<tag>
          # ─────────────────────────────────────────────────────────────────────
          - name: macOS
            runner: macos-latest
          - name: Ubuntu
            runner: ubuntu-latest
          - name: Fedora
            runner: ubuntu-latest
            container: fedora:latest
          - name: AlmaLinux
            runner: ubuntu-latest
            container: almalinux:latest
          - name: Windows
            runner: windows-latest
            # Windows' official Python installer registers only `python.exe`,
            # not `python3.exe`. Every other leg keeps using `python3`
            # unchanged (verified working today) rather than assuming an
            # unversioned `python` alias exists on the dnf-based container
            # images too -- that's a real, distro-version-dependent gotcha
            # (PEP 394) not worth gambling on without a way to verify it here.
            python: python

    steps:
      - uses: actions/checkout@v6

      # Container images don't ship with pip; install Python tooling via dnf.
      # Both Fedora and AlmaLinux use dnf, so one step covers both.
      - name: Install Python and pip (container)
        if: matrix.container
        run: dnf install -y python3 python3-pip

      - name: Set up Python (native runner)
        if: "!matrix.container"
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # matrix.python defaults to python3 (every non-Windows leg); only the
      # Windows entry above overrides it to `python`.
      - name: Install package and test dependencies
        run: ${{ matrix.python || 'python3' }} -m pip install pytest pytest-timeout -e .

      # htcondor only publishes Linux wheels -- no Windows wheel either
      # (confirmed via pypi.org/pypi/htcondor/json: manylinux_2_28 x86_64/
      # aarch64 only), so the Windows leg falls through to the mock stub
      # below exactly like the macOS leg already does.
      - name: Install htcondor (Linux only)
        if: runner.os == 'Linux'
        run: python3 -m pip install htcondor

      # macOS has no htcondor wheel, and get.htcondor.org's install script
      # hardcodes ARCH=x86_64 for macOS with no arm64/aarch64 branch -- the
      # tarball it serves cannot load on GitHub's macos-latest runner (Apple
      # Silicon/arm64), so import htcondor2 would always fail here regardless
      # of how it's installed. Left commented out (not deleted) so this can
      # be re-enabled if HTCondor ever publishes an arm64 macOS tarball;
      # tests/conftest.py's mock stub covers macOS in the meantime.
      #
      # - name: Install HTCondor (macOS only, best-effort)
      #   if: runner.os == 'macOS'
      #   continue-on-error: true
      #   run: |
      #     cd "$RUNNER_TEMP"
      #     curl -fsSL https://get.htcondor.org | /bin/bash -s -- --download
      #     sudo mkdir -p /usr/local/condor
      #     sudo tar -x -C /usr/local/condor --no-same-owner --strip-components 1 -f condor.tar.gz
      #     echo "PYTHONPATH=/usr/local/condor/lib/python3" >> "$GITHUB_ENV"

      - name: Report HTCondor bindings source
        run: ${{ matrix.python || 'python3' }} .github/scripts/report_htcondor_bindings.py

      - name: Run tests
        run: ${{ matrix.python || 'python3' }} -m pytest

      # A real downloadable archive of every test's own working directory
      # (tests/execution/<Class>__<test>, see conftest.py's tmp_path
      # fixture -- htflow's own DEBUG-level log plus whatever job
      # output/error files it produced) rather than relying on pytest's own
      # captured-output summary, which can truncate or miss exactly the
      # detail needed to diagnose a platform-specific failure. shell: bash
      # works unmodified on every leg in this matrix, Windows included
      # (GitHub-hosted Windows runners ship Git Bash), so this needs no
      # per-OS branching the way the steps above do.
      - name: Package test execution artifacts on failure
        if: failure()
        shell: bash
        run: tar -czf "test-execution-${{ matrix.name }}.tar.gz" tests/execution 2>&1 || true

      - name: Upload test execution artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-execution-${{ matrix.name }}
          path: test-execution-${{ matrix.name }}.tar.gz
          if-no-files-found: ignore
          retention-days: 7
